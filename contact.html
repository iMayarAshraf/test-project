<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>contact</title>
        <link rel="Stylesheet" href="css/Stylesheet.css">
    </head>
    
    <body >
        <main>
            <h1>contact</h1>
            
                <label for="name">Name</label>
                <input type="text" id="name" placeholder="username" name="name" required>
            
            <br>
            
                <label>Email</label>
                <input type="email" id="email" placeholder="Enter Email" name="email" required>
            
            <br>
            
                <label for="phone">phone</label>
                <input type="number" id="phone" placeholder="Enter number" name="Number" required>
            
            <br>
            
                <label for="date" >date</label>
                <input type="date" id="date" name="date" required>
            
            <br>
            
            <label for="male">male</label>
            <input type="radio" id="male" name="gender" value="male"  >
             <label for="female">female</label>
            <input type="radio" id="female" name="gender" value="female" >
            <br>
            <label for="html">html</label>
            <input type="checkbox" id="html" name="skills" value="html">
            <label for="css">css</label>
            <input type="checkbox" id="css" name="skills" value="css">
            <label for="java">java</label>
            <input type="checkbox" id="java" name="skills" value="java">
            <br>
            <label for="country">country</label>
            <select name="country" id="country">
                <option value="1">Egypt</option>
                <option value="2">German</option>
                <option value="3">USA</option>
            </select>
            <br>
            <textarea name="text" id="text" rows="4" cols="40" placeholder="text"></textarea>
        </main>
    </body>
